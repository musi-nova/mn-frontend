<app-sidebar></app-sidebar>
<div class="main-content">
    <h1>Create Smart URL</h1>
    <form (ngSubmit)="onSubmit(smartUrlForm)" #smartUrlForm="ngForm">
        <div class="form-group">
            <label for="businessId">Business ID</label>
            <input type="text" id="businessId" name="businessId" ngModel required>
        </div>
        <div class="form-group">
            <label for="adAccountId">Ad Account ID</label>
            <input type="text" id="adAccountId" name="adAccountId" ngModel required>
        </div>
        <div class="form-group">
            <label for="pixelId">Pixel ID</label>
            <input type="text" id="pixelId" name="pixelId" ngModel required>
        </div>
        <div class="form-group">
            <label for="playlistId">Playlist ID</label>
            <input type="text" id="playlistId" name="playlistId" ngModel required>
        </div>
        <button type="submit" [disabled]="smartUrlForm.invalid">Create Smart URL</button>
    </form>
    <div *ngIf="smartUrl">
        <h2>Smart URL</h2>
        <a class="smart-url-link" [href]="smartUrl" target="_blank">{{ smartUrl }}</a>
    </div>
</div>
